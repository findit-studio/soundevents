name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README'
      - 'COPYRIGHT'
      - 'LICENSE-*'
      - '**.md'
      - '**.txt'
  pull_request:
    paths-ignore:
      - 'README'
      - 'COPYRIGHT'
      - 'LICENSE-*'
      - '**.md'
      - '**.txt'
  workflow_dispatch:
  schedule: 
    - cron: "0 1 1 * *"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  RUST_BACKTRACE: 1

jobs:
  # Check formatting (platform-independent, one OS is enough)
  rustfmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install Rust
      run: rustup update stable && rustup default stable && rustup component add rustfmt
    - name: Check formatting
      run: cargo fmt --all -- --check

  # Apply clippy lints
  clippy:
    name: clippy
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - name: Install Rust
      # --no-self-update is necessary because the windows environment cannot self-update rustup.exe.
      run: rustup update stable --no-self-update && rustup default stable && rustup component add clippy
    - name: Install cargo-hack
      run: cargo install cargo-hack
    - name: Apply clippy lints
      run: cargo hack clippy --each-feature

  build:
    name: build
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - name: Cache cargo build and registry
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-build-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-build-
    - name: Install Rust
      # --no-self-update is necessary because the windows environment cannot self-update rustup.exe.
      run: rustup update stable --no-self-update && rustup default stable
    - name: Install cargo-hack
      run: cargo install cargo-hack
    - name: Run build
      run: cargo hack build --feature-powerset

  test:
    name: test
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - name: Cache cargo build and registry
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-test-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-test-
    - name: Install Rust
      # --no-self-update is necessary because the windows environment cannot self-update rustup.exe.
      run: rustup update stable --no-self-update && rustup default stable
    - name: Install cargo-hack
      run: cargo install cargo-hack
    - name: Run test
      run: cargo hack test --feature-powerset
    - name: Run xtask tests
      # `xtask` is not a workspace default member, so the powerset above
      # never reaches it. Its permanent-id ledger decides which
      # `SoundEventId` every entry ships with — a public API guarantee —
      # so its unit tests have to run somewhere. A plain `cargo test -p`
      # sidesteps the `--feature-powerset` problem entirely.
      run: cargo test -p xtask

  # `cargo xtask codegen` must be idempotent: re-running it should leave
  # both `generated.rs` files byte-identical to what is committed. Catches
  # drift between `assets/` and the checked-in generated source.
  #
  # `assets/sound_ids.csv` — the permanent-id ledger — is checked with
  # them, and is the more important of the two: the generator *mints* into
  # that file, so an ontology entry with no ledger row would otherwise get
  # an id here in CI that never reaches the repository, and the next run
  # would mint a different one. Diffing it makes an unminted class a loud
  # failure instead of a silently unstable id.
  codegen-up-to-date:
    name: codegen-up-to-date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup update stable && rustup default stable && rustup component add rustfmt
      - name: cargo xtask codegen
        # `cargo fmt` is part of the regeneration, not a separate tidy-up:
        # the generator emits four-space `prettyplease` output while
        # `rustfmt.toml` sets `tab_spaces = 2`, so skipping it would report
        # a ~30,000-line whitespace diff as drift.
        run: cargo run --release -p xtask -- codegen && cargo fmt --all
      - name: generated.rs + sound_ids.csv unchanged and tracked
        # `git status --porcelain`, not `git diff`: a ledger deleted in a
        # commit and recreated by the codegen step above comes back
        # UNTRACKED, which `git diff` does not report — and a recreated
        # ledger has lost every retired id, freeing those numbers to be
        # reminted for different classes. Untracked output must fail here.
        run: |
          git ls-files --error-unmatch soundevents-dataset/assets/sound_ids.csv > /dev/null || {
            echo "::error::soundevents-dataset/assets/sound_ids.csv is not tracked. The permanent-id ledger is the only record of which ids have been handed out; it must be committed."
            exit 1
          }
          # The codegen transaction lock is anchored on this file, and the
          # anchor has to be the SAME file for every run. An untracked one
          # can be unlinked and recreated, which leaves a holder locking an
          # inode nobody else can reach — the lock silently stops locking
          # and two runs can mint the same id.
          git ls-files --error-unmatch soundevents-dataset/assets/codegen.lock > /dev/null || {
            echo "::error::soundevents-dataset/assets/codegen.lock is not tracked. It anchors the codegen transaction lock; an untracked anchor can be replaced out from under a holder, and the lock stops excluding anything."
            exit 1
          }
          PATHS="soundevents-dataset/src/ontology/generated.rs soundevents-dataset/src/rated/generated.rs soundevents-dataset/assets/sound_ids.csv"
          DRIFT=$(git status --porcelain -- $PATHS)
          if [ -n "$DRIFT" ]; then
            echo "::error::the generated tables / sound_ids.csv are out of sync with assets/ — run 'cargo xtask codegen && cargo fmt --all' and commit the result."
            echo "$DRIFT"
            git diff -- $PATHS
            exit 1
          fi

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    needs:
      - rustfmt
      - clippy
      - build
      - test
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup update nightly && rustup default nightly
      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-coverage-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-coverage-
      - name: Run tarpaulin
        env:
          RUSTFLAGS: "--cfg tarpaulin"
        run: cargo tarpaulin --all-features --run-types tests --run-types doctests --workspace --out xml
      - name: Upload to codecov.io
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ${{ github.repository }}
          fail_ci_if_error: true
