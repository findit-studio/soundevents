[package]
name = "soundevents"
version = "0.4.0"
edition = "2024"
description = "Production-oriented Rust inference wrapper for CED AudioSet classifiers."
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/soundevents"
readme = "README.md"
keywords = ["audioset", "audio-classification", "ced", "sound-events", "onnx"]
categories = ["multimedia::audio", "science"]
rust-version = "1.85"
include = [
  "Cargo.toml",
  "README.md",
  "THIRD_PARTY_NOTICES.md",
  "build.rs",
  "LICENSE-APACHE",
  "LICENSE-MIT",
  "models/tiny.onnx",
  "src/**",
]

[features]
# Tiny CED is ~6.4 MB, so bundling stays opt-in instead of inflating every
# binary by default.
default = []
bundled-tiny = []

serde = ["dep:serde"]

# ORT execution-provider passthroughs. Off by default; enabling a feature only
# links the EP into ort-sys — downstream callers must still register the EP at
# runtime via `Session::builder().with_execution_providers([...])`. CoreML on
# the bundled CED graphs has been observed to silently emit zeroed logits on
# macOS (ORT 2.0.0-rc.12, weight-only-quantized export); verify outputs before
# shipping any GPU-enabled build. CUDA/DirectML have not been audited for this
# graph and may be useful on Linux/Windows.
coreml   = ["ort/coreml"]
directml = ["ort/directml"]
cuda     = ["ort/cuda"]
rocm     = ["ort/rocm"]
tensorrt = ["ort/tensorrt"]
openvino = ["ort/openvino"]

[dependencies]
ort = "2.0.0-rc.13"
smol_str = "0.3"
thiserror = { workspace = true, features = ["default"] }

soundevents-dataset = { workspace = true, features = ["rated"] }

serde = { workspace = true, optional = true, features = ["derive"] }

[dev-dependencies]
serde_json = "1"

# Keep this version identical to the `ort` requirement above; the two entries
# resolve to one package and differ only in this feature.
#
# `--all-features` switches on every EP passthrough at once, and no prebuilt
# ONNX Runtime ships that combination. `ort` 2.0.0-rc.13 reports the mismatch as
# a link error, where rc.12 silently substituted the EP-less build — so the
# combination never linked what it claimed, it just used to fail quietly. No
# test in this workspace registers an execution provider, so the distribution
# the test binaries link is immaterial to what they assert, and opting them back
# into the substitution keeps `cargo test --all-features` usable. It stays in
# `dev-dependencies` so it cannot reach a downstream build, where a silently
# substituted distribution would be a genuine defect.
ort = { version = "2.0.0-rc.13", features = ["lax-feature-matching"] }

[lints.rust]
rust_2018_idioms = "warn"
single_use_lifetimes = "warn"
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(all_tests)',
  'cfg(tarpaulin)',
] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
